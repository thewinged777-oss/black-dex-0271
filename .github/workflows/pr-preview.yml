name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: black-dex-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install PR dependencies
        if: github.event.action != 'closed'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build PR preview
        if: github.event.action != 'closed'
        run: yarn build:spa
        env:
          VITE_DEPLOYMENT_ENV: mainnet
          PUBLIC_PATH: /pr-${{ github.event.pull_request.number || 'manual' }}/
          VITE_PUBLIC_PATH: /pr-${{ github.event.pull_request.number || 'manual' }}/
          VITE_BASE_URL: /pr-${{ github.event.pull_request.number || 'manual' }}

      - name: Save PR build
        if: github.event.action != 'closed'
        run: mv build/client /tmp/pr-preview

      - name: Checkout main
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install main dependencies
        if: github.event.action != 'closed'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build production copy
        if: github.event.action != 'closed'
        run: yarn build:spa
        env:
          VITE_DEPLOYMENT_ENV: mainnet
          PUBLIC_PATH: /
          VITE_PUBLIC_PATH: /
          VITE_BASE_URL: ''

      - name: Assemble production + PR preview
        if: github.event.action != 'closed'
        run: |
          mkdir -p build/client/pr-${{ github.event.pull_request.number || 'manual' }}
          cp -a /tmp/pr-preview/. build/client/pr-${{ github.event.pull_request.number || 'manual' }}/

      - name: Configure Pages
        if: github.event.action != 'closed'
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        if: github.event.action != 'closed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

      - name: Deploy combined Pages site
        if: github.event.action != 'closed'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deployment.outputs.page_url }}pr-${context.issue.number}/`;
            const marker = '<!-- black-dex-preview -->';
            const body = `${marker}\n## 🟡 BLACK DEX Preview\n\n**Preview:** ${url}\n\nThis is a PR preview only. Production remains at https://black-dex.online/`;
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Remove closed PR preview and redeploy production
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js for cleanup
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install production dependencies for cleanup
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build clean production site
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: yarn build:spa
        env:
          VITE_DEPLOYMENT_ENV: mainnet
          PUBLIC_PATH: /
          VITE_PUBLIC_PATH: /
          VITE_BASE_URL: ''

      - name: Configure Pages for cleanup
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/configure-pages@v5

      - name: Upload clean production artifact
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

      - name: Redeploy clean production site
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/deploy-pages@v4

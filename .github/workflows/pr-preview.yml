name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-preview-${{ github.event.pull_request.number || 'manual' }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build preview
        run: yarn build:spa
        env:
          VITE_DEPLOYMENT_ENV: mainnet
          PUBLIC_PATH: /${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'preview' }}/
          VITE_PUBLIC_PATH: /${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'preview' }}/
          VITE_BASE_URL: /${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'preview' }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deployment.outputs.page_url }}';
            const marker = '<!-- black-dex-preview -->';
            const body = `${marker}\n## 🟡 BLACK DEX Preview\n\n**Preview:** ${url}\n\nThis is a PR preview only. It does **not** change `black-dex.online`.`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
